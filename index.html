<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="p-4">
      <p class="text-center text-2xl">Multiplication Table</p>
      <input
        type="number"
        class="mt-4 border rounded-lg bg-gray-400 w-full text-4xl text-white text-center p-4 cursor-pointer"
        id="inputNumber"
      />
      <button
        onclick="press()"
        class="border rounded-lg text-white bg-blue-500 mt-4 w-full p-4 cursor-pointer"
      >
        Generate Table
      </button>

      <div class="overflow-x-auto w-full">
        <table
          class="min-w-max border border-gray-300 border-collapse mt-4 p-4"
        >
          <thead id="tableHeader" class=""></thead>
          <tbody id="table"></tbody>
        </table>
      </div>
    </div>
    <script>
      function press() {
        let tableHeader = document.getElementById("tableHeader");
        let limit = document.getElementById("inputNumber").value;
        let table = document.getElementById("table");

        let result = "<tr>";
        for (a = 2; a <= limit; a++) {
          result += `<td class="border border-gray-300 px-6 py-2"">Table ${a}</td>`;
        }
        result += "</tr>";
        tableHeader.innerHTML = result;

        if (limit === "") {
          alert("Input a number");
          return;
        }

        let display = "";
        for (let j = 1; j <= 12; j++) {
          display += "<tr>";
          for (let i = 2; i <= limit; i++) {
            display += `<td class= "p-2">${i} x ${j} = ${i * j}</td>`;
          }
          display += "</tr>";
        }
        table.innerHTML = display;
      }
    </script>
  </body>
</html>
