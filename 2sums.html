<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let input = prompt(
        "Enter numbers separated by spaces (e.g., 2 7 11 15):"
      );
      let nums = input.split(" ").map(Number); // convert strings to numbers

      // Ask user for the target
      let target = Number(prompt("Enter the target number:"));

      // Two Sum function
      function twoSum(nums, target) {
        for (let i = 0; i < nums.length; i++) {
          for (let j = i + 1; j < nums.length; j++) {
            if (nums[i] + nums[j] === target) {
              return [i, j]; // return indices
            }
          }
        }
      }

      // Show result
      let result = twoSum(nums, target);
      alert("Indices of the two numbers: " + result);
    </script>
  </body>
</html>
