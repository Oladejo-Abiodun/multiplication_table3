<!DOCTYPE html>
<html lang="en">

    <title>Document</title>

  <body>
    <p>Exercise 4: Reverse the List</p>
    <script>
      let input = prompt("Enter numbers separated by spaces");
      let nums = input.split(" ").map(Number);

      for (let i = nums.length - 1; i >= 0; i--) {
        console.log(nums[i]);
      }
    </script>
  </body>
</html>
